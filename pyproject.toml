[project]
name = "saavn-downloader"
version = "0.1.0"
description = "Download songs, albums, playlists and artists from JioSaavn"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47.0",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
